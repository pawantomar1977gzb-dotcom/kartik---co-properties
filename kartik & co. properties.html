<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartik & Co. Properties</title>
</head>
<body>
<style>
  :root{
    --paper:#EDE8D9;
    --paper-2:#E4DFCE;
    --ink:#20241F;
    --ink-soft:#4A4C40;
    --seal:#96372B;
    --seal-soft:#B9564A;
    --soil:#6E5A3E;
    --sage:#7C8267;
    --line: rgba(32,36,31,0.16);
    --radius: 2px;
  }
  * { box-sizing: border-box; }
  #kc-root {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', 'Segoe UI', Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  #kc-root h1, #kc-root h2, #kc-root h3 {
    font-family: 'Roboto Slab', Georgia, 'Times New Roman', serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }
  #kc-root p { margin: 0; }
  #kc-root a { color: inherit; }
  #kc-root button { font-family: inherit; cursor: pointer; }

  .kc-wrap { max-width: 980px; margin: 0 auto; padding: 0 28px; }

  /* HEADER */
  .kc-header {
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
  }
  .kc-header-inner { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .kc-brand { display:flex; align-items:baseline; gap:10px; }
  .kc-brand-mark {
    width: 34px; height: 34px; border: 1.5px solid var(--ink); border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Roboto Slab', serif; font-weight:700; font-size: 14px; flex-shrink:0;
  }
  .kc-brand-name { font-family:'Roboto Slab', serif; font-weight:700; font-size: 19px; }
  .kc-brand-tag { font-size: 12px; color: var(--ink-soft); margin-top:2px; }
  .kc-nav { display:flex; gap: 22px; font-size: 14px; }
  .kc-nav button {
    background:none; border:none; color: var(--ink-soft); padding: 4px 0;
    border-bottom: 1.5px solid transparent; font-size: 14px;
  }
  .kc-nav button.active, .kc-nav button:hover { color: var(--ink); border-bottom-color: var(--seal); }

  /* HERO */
  .kc-hero { padding: 64px 0 48px; border-bottom: 1px solid var(--line); }
  .kc-hero-eyebrow { font-size: 13px; color: var(--soil); margin-bottom: 14px; }
  .kc-hero h1 { font-size: 42px; line-height: 1.12; max-width: 620px; }
  .kc-hero-sub { margin-top: 18px; font-size: 16.5px; color: var(--ink-soft); max-width: 520px; }
  .kc-hero-actions { display:flex; gap: 14px; margin-top: 30px; flex-wrap: wrap; }
  .kc-btn {
    display:inline-block; padding: 12px 22px; font-size: 14.5px; border-radius: var(--radius);
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink); text-decoration:none;
  }
  .kc-btn:hover { background: var(--ink); color: var(--paper); }
  .kc-btn-solid { background: var(--seal); border-color: var(--seal); color: var(--paper); }
  .kc-btn-solid:hover { background: var(--seal-soft); border-color: var(--seal-soft); color: var(--paper); }

  .kc-areas { display:flex; gap:10px; flex-wrap:wrap; margin-top: 34px; }
  .kc-area-chip {
    font-size: 12.5px; padding: 6px 12px; border: 1px solid var(--line);
    color: var(--ink-soft); border-radius: 20px;
  }

  .kc-trust { padding: 30px 0; border-bottom: 1px solid var(--line); display:flex; gap:40px; flex-wrap:wrap; }
  .kc-trust-item { max-width: 260px; font-size: 14px; color: var(--ink-soft); padding-left: 16px; border-left: 2px solid var(--sage); }
  .kc-trust-item strong { display:block; color: var(--ink); font-size: 14.5px; margin-bottom: 3px; font-family:'Roboto Slab',serif; }

  /* SECTION HEADS */
  .kc-section { padding: 52px 0; border-bottom: 1px solid var(--line); }
  .kc-section-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom: 30px; flex-wrap: wrap; }
  .kc-section-head h2 { font-size: 26px; }
  .kc-section-desc { font-size: 14px; color: var(--ink-soft); max-width: 440px; margin-top: 6px; }

  /* FILTERS */
  .kc-filters { display:flex; gap: 22px; flex-wrap: wrap; margin-bottom: 28px; font-size: 13px; }
  .kc-filter-group { display:flex; flex-direction:column; gap:6px; }
  .kc-filter-label { color: var(--soil); font-size: 11.5px; }
  .kc-filter-opts { display:flex; gap:6px; flex-wrap:wrap; }
  .kc-filter-opts button {
    background:none; border:1px solid var(--line); color: var(--ink-soft);
    padding: 6px 12px; font-size: 13px; border-radius: 20px;
  }
  .kc-filter-opts button.active { border-color: var(--ink); color: var(--ink); background: var(--paper-2); }

  /* LISTINGS GRID */
  .kc-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 20px; }
  .kc-card {
    border: 1px solid var(--line); background: var(--paper-2); padding: 0;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .kc-card-plot {
    aspect-ratio: 16/10; position:relative; border-bottom:1px solid var(--line);
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/16px 16px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/16px 16px,
      var(--paper);
  }
  .kc-card-plot svg { width:100%; height:100%; }
  .kc-card-type-badge {
    position:absolute; top:10px; left:10px; font-size:11px; padding: 3px 9px;
    background: var(--ink); color: var(--paper); border-radius: 2px; letter-spacing:.02em;
  }
  .kc-card-body { padding: 16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .kc-card-title { font-size: 16.5px; font-weight:700; font-family:'Roboto Slab',serif; }
  .kc-card-loc { font-size: 13px; color: var(--ink-soft); }
  .kc-card-meta { display:flex; gap:14px; font-size: 12.5px; color: var(--soil); margin-top:2px; }
  .kc-card-desc { font-size: 13px; color: var(--ink-soft); margin-top: 4px; flex:1; }
  .kc-card-foot { display:flex; justify-content:space-between; align-items:center; margin-top: 10px; padding-top:10px; border-top:1px dashed var(--line); }
  .kc-card-price { font-weight:700; font-family:'Roboto Slab',serif; font-size:15px; }
  .kc-card-cta { font-size: 12.5px; color: var(--seal); text-decoration:none; border-bottom:1px solid var(--seal); }

  .kc-empty { padding: 40px 20px; text-align:center; color: var(--ink-soft); border:1px dashed var(--line); font-size:14px; }
  .kc-empty a { color: var(--seal); border-bottom: 1px solid var(--seal); }

  /* ABOUT */
  .kc-about-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .kc-about-grid p { color: var(--ink-soft); font-size: 15px; margin-bottom: 14px; }
  .kc-list-plain { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px; }
  .kc-list-plain li { font-size: 14px; color: var(--ink-soft); padding-left: 18px; position:relative; }
  .kc-list-plain li::before { content:"—"; position:absolute; left:0; color: var(--seal); }

  /* CONTACT */
  .kc-contact-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .kc-contact-info div { margin-bottom: 18px; }
  .kc-contact-label { font-size: 11.5px; color: var(--soil); margin-bottom:4px; }
  .kc-contact-value { font-size: 16px; }
  .kc-form { display:flex; flex-direction:column; gap: 12px; }
  .kc-form input, .kc-form select, .kc-form textarea {
    padding: 10px 12px; border: 1px solid var(--line); background: var(--paper);
    font-size: 14px; font-family: inherit; color: var(--ink); border-radius: var(--radius);
  }
  .kc-form textarea { resize: vertical; min-height: 70px; }
  .kc-form label { font-size: 12px; color: var(--soil); margin-bottom: 3px; display:block; }

  /* FOOTER */
  .kc-footer { padding: 24px 0 40px; font-size: 12.5px; color: var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .kc-footer button { background:none; border:none; color: var(--ink-soft); font-size:12.5px; text-decoration: underline; padding:0; }

  /* ADMIN */
  .kc-admin-gate { max-width: 360px; margin: 80px auto; text-align:center; }
  .kc-admin-gate h2 { margin-bottom: 8px; }
  .kc-admin-gate p { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 20px; }
  .kc-admin-gate input { width:100%; margin-bottom: 12px; }
  .kc-admin-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px; flex-wrap:wrap; gap:10px;}
  .kc-admin-form { border: 1px solid var(--line); background: var(--paper-2); padding: 20px; margin-bottom: 32px; }
  .kc-admin-form h3 { font-size: 15px; margin-bottom: 14px; }
  .kc-form-row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .kc-admin-table { width:100%; border-collapse: collapse; font-size: 13.5px; }
  .kc-admin-table th, .kc-admin-table td { text-align:left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .kc-admin-table th { color: var(--soil); font-weight:600; font-size:12px; }
  .kc-row-actions button { background:none; border:none; font-size:12.5px; margin-right:12px; color: var(--seal); text-decoration:underline; padding:0; }
  .kc-msg { font-size: 13px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; }
  .kc-msg-error { background: #f2ddd9; color: var(--seal); }
  .kc-msg-ok { background: #e3e6da; color: #3f4a2f; }

  @media (max-width: 720px){
    .kc-hero h1 { font-size: 30px; }
    .kc-about-grid, .kc-contact-grid, .kc-form-row { grid-template-columns: 1fr; }
    .kc-nav { gap: 14px; font-size: 13px; }
  }
</style>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<div id="kc-root">
  <header class="kc-header">
    <div class="kc-wrap kc-header-inner">
      <div class="kc-brand">
        <div class="kc-brand-mark">K</div>
        <div>
          <div class="kc-brand-name">Kartik &amp; Co. Properties</div>
          <div class="kc-brand-tag">Plots · Land · Villas</div>
        </div>
      </div>
      <nav class="kc-nav" id="kc-nav"></nav>
    </div>
  </header>
  <div id="kc-page"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-mnBxV2VRiNy8KxYJg2uoAcHmuh12EP0",
  authDomain: "kartik-properties-30239.firebaseapp.com",
  projectId: "kartik-properties-30239",
  storageBucket: "kartik-properties-30239.firebasestorage.app",
  messagingSenderId: "565489950248",
  appId: "1:565489950248:web:50358467cb2ca1d8c7df1d"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

(function(){

  const PROPERTY_TYPES = ["Plot","Land","Villa"];
  const REGIONS = ["Ghaziabad","Madhya Pradesh","Uttarakhand","Uttar Pradesh"];
  const AREA_UNITS = ["sq.ft","sq.yd","acre","bigha"];

  const PHONE_DISPLAY = "+91 93196 02507";
  const WHATSAPP_NUMBER = "919319602507"; // country code + number, no symbols

  function waLink(message){
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  }

  let state = {
    tab: 'home',
    listings: [],
    loading: true,
    filterType: 'All',
    filterRegion: 'All',
    adminAuthed: false,
    adminChecking: true,
    adminEmailInput: '',
    adminPwInput: '',
    adminError: '',
    editingId: null,
    formDraft: blankDraft(),
    formError: '',
  };

  auth.onAuthStateChanged(function(user){
    state.adminAuthed = !!user;
    state.adminChecking = false;
    if(state.tab === 'admin') render();
  });

  function blankDraft(){
    return { title:'', type:'Plot', city:'', region:'Ghaziabad', price:'', area:'', areaUnit:'sq.yd', description:'' };
  }

  function uid(){ return 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  async function loadListings(){
    try {
      const snap = await db.collection('listings').orderBy('createdAt', 'desc').get();
      state.listings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) {
      console.error('load failed', e);
      state.listings = [];
    }
    state.loading = false;
    render();
  }

  async function addListingDoc(data){
    await db.collection('listings').add({ ...data, createdAt: Date.now() });
  }

  async function updateListingDoc(id, data){
    await db.collection('listings').doc(id).set(data, { merge: true });
  }

  async function deleteListingDoc(id){
    await db.collection('listings').doc(id).delete();
  }

  function go(tab){ state.tab = tab; state.formError=''; render(); window.scrollTo(0,0); }

  function plotSvg(type){
    const stroke = "#20241F";
    if(type === "Villa"){
      return `<svg viewBox="0 0 200 125" preserveAspectRatio="xMidYMid meet"><polyline points="55,80 55,45 100,20 145,45 145,80" fill="none" stroke="${stroke}" stroke-width="2"/><rect x="55" y="80" width="90" height="2" fill="${stroke}"/><rect x="70" y="55" width="18" height="25" fill="none" stroke="${stroke}" stroke-width="1.5"/><rect x="112" y="55" width="18" height="25" fill="none" stroke="${stroke}" stroke-width="1.5"/></svg>`;
    }
    if(type === "Land"){
      return `<svg viewBox="0 0 200 125" preserveAspectRatio="xMidYMid meet"><polygon points="30,95 60,32 150,40 170,100" fill="none" stroke="${stroke}" stroke-width="2" stroke-dasharray="4 3"/><line x1="30" y1="95" x2="170" y2="100" stroke="${stroke}" stroke-width="1"/></svg>`;
    }
    return `<svg viewBox="0 0 200 125" preserveAspectRatio="xMidYMid meet"><rect x="40" y="30" width="120" height="70" fill="none" stroke="${stroke}" stroke-width="2" stroke-dasharray="5 3"/><circle cx="40" cy="30" r="2.5" fill="${stroke}"/><circle cx="160" cy="30" r="2.5" fill="${stroke}"/><circle cx="40" cy="100" r="2.5" fill="${stroke}"/><circle cx="160" cy="100" r="2.5" fill="${stroke}"/></svg>`;
  }

  function card(l){
    return `<div class="kc-card">
      <div class="kc-card-plot">
        <span class="kc-card-type-badge">${l.type}</span>
        ${plotSvg(l.type)}
      </div>
      <div class="kc-card-body">
        <div class="kc-card-title">${escapeHtml(l.title)}</div>
        <div class="kc-card-loc">${escapeHtml(l.city)}, ${escapeHtml(l.region)}</div>
        <div class="kc-card-meta"><span>${escapeHtml(l.area)} ${escapeHtml(l.areaUnit)}</span></div>
        ${l.description ? `<div class="kc-card-desc">${escapeHtml(l.description)}</div>` : ''}
        <div class="kc-card-foot">
          <div class="kc-card-price">${escapeHtml(l.price)}</div>
          <a class="kc-card-cta" href="#" onclick="return false;">Enquire →</a>
        </div>
      </div>
    </div>`;
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function filteredListings(){
    return state.listings.filter(l =>
      (state.filterType === 'All' || l.type === state.filterType) &&
      (state.filterRegion === 'All' || l.region === state.filterRegion)
    );
  }

  function renderNav(){
    const items = [['home','Home'],['listings','Listings'],['about','About'],['contact','Contact']];
    document.getElementById('kc-nav').innerHTML = items.map(([id,label]) =>
      `<button data-tab="${id}" class="${state.tab===id?'active':''}">${label}</button>`
    ).join('');
    document.querySelectorAll('#kc-nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
  }

  function renderHome(){
    return `
    <section class="kc-hero">
      <div class="kc-wrap">
        <div class="kc-hero-eyebrow">Plots · Agricultural Land · Villas</div>
        <h1>Land and plots you can build a future on.</h1>
        <p class="kc-hero-sub">Kartik &amp; Co. Properties helps families and investors find verified plots, land, and villas across Ghaziabad and beyond — every listing personally visited before it's offered.</p>
        <div class="kc-hero-actions">
          <button class="kc-btn kc-btn-solid" onclick="window.__kcGo('listings')">View listings</button>
          <a class="kc-btn" href="${waLink("Hi, I'm interested in your plots/land listings.")}" target="_blank" rel="noopener">Enquire on WhatsApp</a>
        </div>
        <div class="kc-areas">
          ${REGIONS.map(r => `<span class="kc-area-chip">${r}</span>`).join('')}
        </div>
      </div>
    </section>
    <section class="kc-trust">
      <div class="kc-wrap" style="display:flex; gap:40px; flex-wrap:wrap;">
        <div class="kc-trust-item"><strong>On-ground visits</strong>Every plot is checked in person before it's listed — no relisted broker photos.</div>
        <div class="kc-trust-item"><strong>Direct dealing</strong>You deal with Kartik directly, not a chain of sub-agents.</div>
        <div class="kc-trust-item"><strong>Multi-region reach</strong>Active listings across Ghaziabad, Uttar Pradesh, Uttarakhand, and Madhya Pradesh.</div>
      </div>
    </section>
    <section class="kc-section" style="border-bottom:none;">
      <div class="kc-wrap">
        <div class="kc-section-head">
          <div>
            <h2>Recent listings</h2>
            <div class="kc-section-desc">A sample of what's currently available.</div>
          </div>
          <button class="kc-btn" onclick="window.__kcGo('listings')">See all</button>
        </div>
        ${renderListingsPreview()}
      </div>
    </section>`;
  }

  function renderListingsPreview(){
    const items = state.listings.slice(0,3);
    if(state.loading) return `<div class="kc-empty">Loading listings…</div>`;
    if(!items.length) return `<div class="kc-empty">No listings yet. <a href="#" onclick="window.__kcGo('admin');return false;">Add the first one from Admin →</a></div>`;
    return `<div class="kc-grid">${items.map(card).join('')}</div>`;
  }

  function renderListings(){
    const items = filteredListings();
    return `
    <section class="kc-section" style="border-bottom:none; padding-top:44px;">
      <div class="kc-wrap">
        <div class="kc-section-head">
          <div>
            <h2>All listings</h2>
            <div class="kc-section-desc">Plots, land, and villas currently available.</div>
          </div>
        </div>
        <div class="kc-filters">
          <div class="kc-filter-group">
            <div class="kc-filter-label">TYPE</div>
            <div class="kc-filter-opts" id="kc-f-type">
              ${['All',...PROPERTY_TYPES].map(t => `<button data-v="${t}" class="${state.filterType===t?'active':''}">${t}</button>`).join('')}
            </div>
          </div>
          <div class="kc-filter-group">
            <div class="kc-filter-label">LOCATION</div>
            <div class="kc-filter-opts" id="kc-f-region">
              ${['All',...REGIONS].map(r => `<button data-v="${r}" class="${state.filterRegion===r?'active':''}">${r}</button>`).join('')}
            </div>
          </div>
        </div>
        ${state.loading ? `<div class="kc-empty">Loading listings…</div>` :
          items.length ? `<div class="kc-grid">${items.map(card).join('')}</div>` :
          `<div class="kc-empty">No listings match these filters yet.</div>`}
      </div>
    </section>`;
  }

  function renderAbout(){
    return `
    <section class="kc-section" style="border-bottom:none; padding-top:44px;">
      <div class="kc-wrap kc-about-grid">
        <div>
          <h2 style="margin-bottom:16px;">About Kartik &amp; Co.</h2>
          <p>Kartik &amp; Co. Properties works directly with buyers and sellers of plots, agricultural land, and villas — based in Ghaziabad, with active dealings across Uttar Pradesh, Uttarakhand, and Madhya Pradesh.</p>
          <p>Every listing is visited on the ground before it's offered, and every deal is handled directly — no long chain of sub-brokers between you and the property.</p>
        </div>
        <div>
          <h3 style="font-size:15px; margin-bottom:14px;">What we deal in</h3>
          <ul class="kc-list-plain">
            <li>Residential plots, ready for construction</li>
            <li>Agricultural and undeveloped land</li>
            <li>Independent villas</li>
            <li>On-ground verification before every listing</li>
            <li>Direct, single-point contact throughout the deal</li>
          </ul>
        </div>
      </div>
    </section>`;
  }

  function renderContact(){
    return `
    <section class="kc-section" style="border-bottom:none; padding-top:44px;">
      <div class="kc-wrap kc-contact-grid">
        <div class="kc-contact-info">
          <h2 style="margin-bottom:20px;">Get in touch</h2>
          <div>
            <div class="kc-contact-label">PHONE</div>
            <div class="kc-contact-value">Add phone number</div>
          </div>
          <div>
            <div class="kc-contact-label">WHATSAPP</div>
            <div class="kc-contact-value">Add WhatsApp number</div>
          </div>
          <div>
            <div class="kc-contact-label">BASE LOCATION</div>
            <div class="kc-contact-value">Ghaziabad, Uttar Pradesh</div>
          </div>
          <div>
            <div class="kc-contact-label">ALSO DEALING IN</div>
            <div class="kc-contact-value">Uttar Pradesh · Uttarakhand · Madhya Pradesh</div>
          </div>
        </div>
        <form class="kc-form" onsubmit="return false;">
          <div>
            <label>Name</label>
            <input type="text" placeholder="Your name">
          </div>
          <div>
            <label>Phone</label>
            <input type="tel" placeholder="Your phone number">
          </div>
          <div>
            <label>Interested in</label>
            <select>
              <option>Plot</option><option>Land</option><option>Villa</option><option>Not sure yet</option>
            </select>
          </div>
          <div>
            <label>Message</label>
            <textarea placeholder="Tell us what you're looking for"></textarea>
          </div>
          <button class="kc-btn kc-btn-solid" style="align-self:flex-start;" type="submit">Send enquiry</button>
          <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">This form isn't wired to send anywhere yet — connect it to WhatsApp click-to-chat or email once you have his contact details.</div>
        </form>
      </div>
    </section>`;
  }

  function renderAdmin(){
    if(state.adminChecking){
      return `<div class="kc-wrap"><div class="kc-admin-gate"><p>Checking login…</p></div></div>`;
    }
    if(!state.adminAuthed){
      return `
      <div class="kc-wrap">
        <div class="kc-admin-gate">
          <h2>Admin</h2>
          <p>Log in with your admin email and password.</p>
          ${state.adminError ? `<div class="kc-msg kc-msg-error">${state.adminError}</div>` : ''}
          <input type="email" id="kc-admin-email" placeholder="Email" value="${escapeHtml(state.adminEmailInput)}" autocomplete="username">
          <input type="password" id="kc-admin-pw" placeholder="Password" value="${escapeHtml(state.adminPwInput)}" autocomplete="current-password">
          <button class="kc-btn kc-btn-solid" style="width:100%;" id="kc-admin-login">Log in</button>
        </div>
      </div>`;
    }

    const d = state.formDraft;
    return `
    <div class="kc-wrap" style="padding-top:36px;">
      <div class="kc-admin-bar">
        <h2>Manage listings</h2>
        <button class="kc-btn" id="kc-admin-logout">Log out</button>
      </div>
      <div class="kc-admin-form">
        <h3>${state.editingId ? 'Edit listing' : 'Add a new listing'}</h3>
        ${state.formError ? `<div class="kc-msg kc-msg-error">${state.formError}</div>` : ''}
        <div class="kc-form" id="kc-listing-form">
          <div>
            <label>Title</label>
            <input type="text" id="f-title" value="${escapeHtml(d.title)}" placeholder="e.g. Corner plot near NH-9">
          </div>
          <div class="kc-form-row">
            <div>
              <label>Type</label>
              <select id="f-type">${PROPERTY_TYPES.map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select>
            </div>
            <div>
              <label>Region</label>
              <select id="f-region">${REGIONS.map(r=>`<option ${d.region===r?'selected':''}>${r}</option>`).join('')}</select>
            </div>
          </div>
          <div class="kc-form-row">
            <div>
              <label>City / Area</label>
              <input type="text" id="f-city" value="${escapeHtml(d.city)}" placeholder="e.g. Indirapuram">
            </div>
            <div>
              <label>Price</label>
              <input type="text" id="f-price" value="${escapeHtml(d.price)}" placeholder="e.g. ₹45,00,000">
            </div>
          </div>
          <div class="kc-form-row">
            <div>
              <label>Area</label>
              <input type="text" id="f-area" value="${escapeHtml(d.area)}" placeholder="e.g. 200">
            </div>
            <div>
              <label>Unit</label>
              <select id="f-areaunit">${AREA_UNITS.map(u=>`<option ${d.areaUnit===u?'selected':''}>${u}</option>`).join('')}</select>
            </div>
          </div>
          <div>
            <label>Description (optional)</label>
            <textarea id="f-desc">${escapeHtml(d.description)}</textarea>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="kc-btn kc-btn-solid" id="kc-save-listing">${state.editingId ? 'Save changes' : 'Add listing'}</button>
            ${state.editingId ? `<button class="kc-btn" id="kc-cancel-edit">Cancel</button>` : ''}
          </div>
        </div>
      </div>

      <h3 style="font-size:15px; margin-bottom:12px;">Current listings (${state.listings.length})</h3>
      ${state.listings.length ? `
      <table class="kc-admin-table">
        <thead><tr><th>Title</th><th>Type</th><th>Location</th><th>Price</th><th></th></tr></thead>
        <tbody>
          ${state.listings.map(l => `
            <tr>
              <td>${escapeHtml(l.title)}</td>
              <td>${escapeHtml(l.type)}</td>
              <td>${escapeHtml(l.city)}, ${escapeHtml(l.region)}</td>
              <td>${escapeHtml(l.price)}</td>
              <td class="kc-row-actions">
                <button data-edit="${l.id}">Edit</button>
                <button data-del="${l.id}">Delete</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="kc-empty">No listings yet — add your first one above.</div>`}
    </div>`;
  }

  function renderFooter(){
    return `<footer class="kc-footer"><div class="kc-wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:10px;">
      <span>© ${new Date().getFullYear()} Kartik &amp; Co. Properties</span>
    </div></footer>`;
  }

  function render(){
    renderNav();
    const page = document.getElementById('kc-page');
    let html = '';
    if(state.tab === 'home') html = renderHome();
    else if(state.tab === 'listings') html = renderListings();
    else if(state.tab === 'about') html = renderAbout();
    else if(state.tab === 'contact') html = renderContact();
    else if(state.tab === 'admin') html = renderAdmin();
    html += renderFooter();
    page.innerHTML = html;
    wireEvents();
  }

  function wireEvents(){
    if(state.tab === 'listings'){
      document.querySelectorAll('#kc-f-type button').forEach(b => b.onclick = () => { state.filterType = b.dataset.v; render(); });
      document.querySelectorAll('#kc-f-region button').forEach(b => b.onclick = () => { state.filterRegion = b.dataset.v; render(); });
    }
    if(state.tab === 'admin'){
      if(!state.adminAuthed){
        const emailInput = document.getElementById('kc-admin-email');
        const pwInput = document.getElementById('kc-admin-pw');
        const tryLogin = async () => {
          state.adminEmailInput = emailInput.value;
          state.adminPwInput = pwInput.value;
          try {
            await auth.signInWithEmailAndPassword(emailInput.value.trim(), pwInput.value);
            state.adminError = '';
          } catch(e) {
            state.adminError = 'Incorrect email or password.';
          }
          render();
        };
        document.getElementById('kc-admin-login').onclick = tryLogin;
        pwInput.onkeydown = (e) => { if(e.key === 'Enter') tryLogin(); };
        emailInput.focus();
      } else {
        document.getElementById('kc-admin-logout').onclick = () => { auth.signOut(); state.adminPwInput=''; state.adminEmailInput=''; render(); };
        document.getElementById('kc-save-listing').onclick = onSaveListing;
        const cancelBtn = document.getElementById('kc-cancel-edit');
        if(cancelBtn) cancelBtn.onclick = () => { state.editingId = null; state.formDraft = blankDraft(); state.formError=''; render(); };
        document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => startEdit(b.dataset.edit));
        document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteListing(b.dataset.del));
      }
    }
  }

  function readForm(){
    return {
      title: document.getElementById('f-title').value.trim(),
      type: document.getElementById('f-type').value,
      region: document.getElementById('f-region').value,
      city: document.getElementById('f-city').value.trim(),
      price: document.getElementById('f-price').value.trim(),
      area: document.getElementById('f-area').value.trim(),
      areaUnit: document.getElementById('f-areaunit').value,
      description: document.getElementById('f-desc').value.trim(),
    };
  }

  async function onSaveListing(){
    const data = readForm();
    if(!data.title || !data.city || !data.price || !data.area){
      state.formError = 'Please fill in title, city, price, and area.';
      render();
      return;
    }
    state.formError = '';
    try {
      if(state.editingId){
        await updateListingDoc(state.editingId, data);
        state.editingId = null;
      } else {
        await addListingDoc(data);
      }
      state.formDraft = blankDraft();
      await loadListings();
    } catch(e) {
      state.formError = 'Could not save — check your connection and try again.';
      render();
    }
  }

  function startEdit(id){
    const l = state.listings.find(x => x.id === id);
    if(!l) return;
    state.editingId = id;
    state.formDraft = { title:l.title, type:l.type, region:l.region, city:l.city, price:l.price, area:l.area, areaUnit:l.areaUnit, description:l.description };
    render();
    window.scrollTo(0,0);
  }

  async function deleteListing(id){
    try {
      await deleteListingDoc(id);
      await loadListings();
    } catch(e) {
      console.error('delete failed', e);
    }
  }

  window.__kcGo = go;
  if(window.location.hash === '#admin'){ state.tab = 'admin'; }
  render();
  loadListings();
})();
</script>

</body>
</html>
